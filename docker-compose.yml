services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: purview_reporting
      POSTGRES_USER: purview_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/persistence/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purview_app -d purview_reporting"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4010
      DATA_PROVIDER: ${DATA_PROVIDER:-demo}
      DATABASE_URL: postgresql://purview_app:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/purview_reporting
      AUTH_MODE: ${AUTH_MODE:-demo}
      CORS_ALLOWED_ORIGINS: http://localhost:3010,http://127.0.0.1:3010
    ports:
      - "4010:4010"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4010
    ports:
      - "3010:3010"

volumes:
  pgdata:
